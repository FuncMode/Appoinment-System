<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="MedicaCare hospital appointment system — book a board-certified specialist online, view real-time availability, and manage visits from your patient portal." />
  <!-- Referrer baseline (works in dev and prod). The Content-Security-Policy

  <title>MedicaCare — Appointment System</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script defer src="/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
